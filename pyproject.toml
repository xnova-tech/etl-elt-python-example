[project]
name = "etl-elt-python-example"
version = "0.1.0"
description = "Typed offline ETL and ELT comparison from XNova"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "ARG", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"run_example.py" = ["T201"]
